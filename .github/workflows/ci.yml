name: CI

# Desktop tests and a signed Android APK for every branch and pull request,
# so Android changes are built (Kotlin plugin, JNI, Gradle) before a release.
# The APK is uploaded as an artifact for testing on a phone.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-apk
        with:
          keystore-base64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          output: Atlas-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-apk
          path: Atlas-Android.apk
          retention-days: 14

  # Boots an Android 14 emulator, installs a release x86_64 build, launches
  # Atlas and fails if it isn't running 30 s later. The screenshot and logcat
  # are uploaded either way, so a crash on a phone can be read here.
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A release build (minified, signed with the real key) like the one
      # phones download, only for the emulator's x86_64 instead of ARM.
      - uses: ./.github/actions/android-apk
        with:
          keystore-base64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          output: atlas-smoke.apk
          targets: x86_64
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r atlas-smoke.apk
            adb shell pm grant com.yegobox.launcher android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell monkey -p com.yegobox.launcher -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > smoke.png
            adb logcat -d > logcat.txt
            adb shell pidof com.yegobox.launcher > pid.txt || true
            adb logcat -d --pid="$(cat pid.txt)" > app-log.txt || true
            grep -E "FATAL|panicked|Tauri|RustStdoutStderr|chromium|Console" app-log.txt | tail -80 || true
            test -s pid.txt || (echo "::error::Atlas is not running 30 s after launch" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke.png
            logcat.txt
            app-log.txt
          if-no-files-found: ignore

name: Release launcher

# Builds and signs the Yegobox Launcher for Windows, macOS and Linux and
# publishes release launcher-v<version> with latest.json, which installed
# launchers poll (tauri.conf.json → plugins.updater.endpoints) to update themselves.
#
# Bump "version" in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and
# package.json, then push tag launcher-v<version>.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (same
# key as yegobox/flipper's desktop_launcher_release.yml), plus for macOS
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # One draft release, created up front. The three build jobs only upload to
  # it (by id): when each created its own, they raced and v0.2.1 came out as
  # two releases, with Windows in the one that wasn't "Latest".
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.id }}
      tag: ${{ steps.r.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="launcher-v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published; bump the version"; exit 1
          fi
          # Re-run of a failed release: reuse its draft.
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)"
          if [[ -z "$ID" ]]; then
            ID="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Atlas v$VERSION" -F draft=true \
              -f body="Download the installer for your computer below. Installed copies of Atlas update themselves." --jq .id)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: macOS signing
        # A missing secret arrives as an empty variable, and the bundler would
        # try to import an empty certificate. Export the Apple variables only
        # when a certificate exists; otherwise ad-hoc sign ("-"), which Apple
        # Silicon needs to run the app at all (users then confirm it once in
        # System Settings → Privacy & Security, as it is not notarized).
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::No Apple certificate: the macOS app is ad-hoc signed and not notarized."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$v<<__EOF__"; printf '%s\n' "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # Written once by `publish` from all three platforms' .sig files;
          # three jobs merging one latest.json can drop a platform.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Only when all three platforms built: add fixed-name installer copies (the
  # website links releases/latest/download/<name> never change), write the
  # updater feed latest.json, then publish the draft as Latest. A partial build
  # stays a draft, so "Latest" never points at a release missing a platform.
  publish:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.create-release.outputs.id }}
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build outputs
        run: |
          mkdir -p dl out
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "dl/$name"
          done
          ls -la dl
      - name: Fixed-name copies + latest.json
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          pick() { local f; f="$(find dl -maxdepth 1 -name "$1" | head -1)"; [[ -n "$f" ]] || { echo "::error::no $1 in the draft"; exit 1; }; echo "$f"; }
          WIN="$(pick '*_x64-setup.exe')"; DMG="$(pick '*_universal.dmg')"
          MACUPD="$(pick '*_universal.app.tar.gz')"; APPIMG="$(pick '*_amd64.AppImage')"; DEB="$(pick '*_amd64.deb')"
          cp "$WIN" out/Atlas-Windows-x64-setup.exe
          cp "$DMG" out/Atlas-macOS.dmg
          cp "$APPIMG" out/Atlas-Linux-x86_64.AppImage
          cp "$DEB" out/Atlas-Linux-amd64.deb
          python3 - "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "$WIN" "$MACUPD" "$APPIMG" "$DEB" > out/latest.json <<'PY'
          import json, sys, os, urllib.parse, datetime
          version, tag, repo, win, mac, appimg, deb = sys.argv[1:]
          def entry(path):
              sig = open(path + ".sig").read().strip()
              url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(os.path.basename(path))}"
              return {"signature": sig, "url": url}
          p = {}
          p["windows-x86_64"] = p["windows-x86_64-nsis"] = entry(win)
          for arch in ("aarch64", "x86_64"):
              p[f"darwin-{arch}"] = p[f"darwin-{arch}-app"] = entry(mac)
          p["linux-x86_64"] = p["linux-x86_64-appimage"] = entry(appimg)
          p["linux-x86_64-deb"] = entry(deb)
          print(json.dumps({
              "version": version,
              "notes": "Download the installer for your computer below. Installed copies of Atlas update themselves.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": p,
          }, indent=2))
          PY
          jq -r '.platforms | keys | join(", ")' out/latest.json
      - name: Upload and publish
        run: |
          for f in out/*; do
            name="$(basename "$f")"
            old="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq ".assets[] | select(.name == \"$name\") | .id")"
            [[ -n "$old" ]] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" --input "$f" --jq .name
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '"published " + .tag_name'

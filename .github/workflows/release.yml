name: Release launcher

# Builds and signs the Yegobox Launcher for Windows, macOS and Linux and
# publishes release launcher-v<version> with latest.json, which installed
# launchers poll (tauri.conf.json → plugins.updater.endpoints) to update themselves.
#
# Bump "version" in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and
# package.json, then push tag launcher-v<version>.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (same
# key as yegobox/flipper's desktop_launcher_release.yml), plus for macOS
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: macOS signing
        # A missing secret arrives as an empty variable, and the bundler would
        # try to import an empty certificate. Export the Apple variables only
        # when a certificate exists; otherwise ad-hoc sign ("-"), which Apple
        # Silicon needs to run the app at all (users then confirm it once in
        # System Settings → Privacy & Security, as it is not notarized).
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::No Apple certificate: the macOS app is ad-hoc signed and not notarized."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$v<<__EOF__"; printf '%s\n' "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: launcher-v__VERSION__
          releaseName: Atlas v__VERSION__
          releaseBody: Download the installer for your computer below. Installed copies of Atlas update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Installer names carry the version (and GitHub turns spaces into dots), so
  # also attach each one under a fixed name: the download links on the website
  # (releases/latest/download/<name>) then never change.
  stable-names:
    needs: release
    # Still attach whatever built when one platform failed.
    if: always() && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Attach fixed-name copies
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="launcher-v$VERSION"
          mkdir -p out
          while read -r pattern name; do
            rm -rf dl && mkdir dl
            if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$pattern" -D dl; then
              cp dl/* "out/$name"
            else
              echo "::warning::no asset matching $pattern on $TAG"
            fi
          done <<'LIST'
          *_x64-setup.exe Atlas-Windows-x64-setup.exe
          *_universal.dmg Atlas-macOS.dmg
          *_amd64.AppImage Atlas-Linux-x86_64.AppImage
          *_amd64.deb Atlas-Linux-amd64.deb
          LIST
          ls -la out
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*

name: Build signed Atlas APK
description: >-
  Generates the Android project, builds a universal release APK (arm64 +
  armv7) and signs it with Atlas's release key. Shared by CI and releases so
  both build the same thing.

inputs:
  keystore-base64:
    required: true
  keystore-password:
    required: true
  key-alias:
    required: true
  output:
    description: Path of the APK to write
    required: true
  targets:
    description: Rust/Android targets for `tauri android build --target`
    default: aarch64 armv7
  debug:
    description: "true = debug build signed with the debug key (emulator smoke test); skips the release key"
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - name: Android SDK + NDK
      shell: bash
      # GitHub's Ubuntu runners ship the Android SDK and NDKs already
      # (installing through sdkmanager stalls on a licence prompt).
      run: |
        [[ -d "$ANDROID_HOME" ]] || { echo "::error::no Android SDK on this runner"; exit 1; }
        NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
        [[ -d "$NDK" ]] || NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        [[ -d "$NDK" ]] || { echo "::error::no Android NDK on this runner"; exit 1; }
        echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
        echo "Android SDK $ANDROID_HOME, NDK $NDK"
    - uses: dtolnay/rust-toolchain@1.95.0
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    - uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        key: android
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - shell: bash
      run: npm ci
    - name: Generate the Android project
      shell: bash
      # src-tauri/gen/android is generated, not committed: Atlas's Android
      # code lives in plugins/tauri-plugin-atlas-android.
      run: |
        npx tauri android init --ci
        npx tauri icon src-tauri/icons/icon.svg
        # Android gets its own launcher icon: the mark inside the adaptive-icon
        # safe zone on white, so circle/squircle masks don't clip it.
        npx tauri icon src-tauri/icons/android-icon.svg -o "$RUNNER_TEMP/android-icons"
        cp -R "$RUNNER_TEMP/android-icons/android/." src-tauri/gen/android/app/src/main/res/
    - name: Build
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        DEBUG: ${{ inputs.debug }}
        OUT: ${{ inputs.output }}
      run: |
        # shellcheck disable=SC2086
        if [[ "$DEBUG" == "true" ]]; then
          npx tauri android build --apk --debug --target $TARGETS --ci
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' | head -1)" "$OUT"
        else
          npx tauri android build --apk --target $TARGETS --ci
        fi
    - name: Sign
      if: inputs.debug != 'true'
      shell: bash
      env:
        KEYSTORE: ${{ inputs.keystore-base64 }}
        KS_PASS: ${{ inputs.keystore-password }}
        ALIAS: ${{ inputs.key-alias }}
        OUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        [[ -n "$KEYSTORE" ]] || { echo "::error::ATLAS_ANDROID_KEYSTORE_BASE64 is not set; refusing to ship an unsigned APK"; exit 1; }
        APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)"
        [[ -n "$APK" ]] || { echo "::error::no unsigned release APK was built"; find src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; }
        BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/atlas.jks"
        "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" sign --ks "$RUNNER_TEMP/atlas.jks" --ks-pass env:KS_PASS --ks-key-alias "$ALIAS" \
          --out "$OUT" "$RUNNER_TEMP/aligned.apk"
        rm -f "$RUNNER_TEMP/atlas.jks"
        "$BT/apksigner" verify --print-certs "$OUT" | grep -E "certificate SHA-256"
        "$BT/aapt2" dump badging "$OUT" | head -1
